<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-proxy admin</title>
<style>
:root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
body { margin: 0 auto; padding: 16px; max-width: 1400px; }
header { display: flex; gap: 12px; align-items: center; }
header h1 { flex: 1; font-size: 18px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8884; vertical-align: top; }
.sub { opacity: 0.7; font-size: 12px; }
.blocked, .expired, .error { color: #d33; }
dialog { width: min(560px, 90vw); }
label { display: block; margin: 8px 0; }
input:not([type=checkbox]), select, textarea { display: block; width: 100%; box-sizing: border-box; }
code { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>llm-proxy admin</h1>
  <span id="who"></span>
  <button id="new-key" hidden>New key</button>
  <button id="sign-out" hidden>Sign out</button>
</header>
<form id="login" hidden>
  <label>Admin API key <input id="login-key" type="password" autocomplete="off" required></label>
  <button>Sign in</button>
  <p class="error" id="login-error"></p>
</form>
<table id="table" hidden>
  <thead><tr><th>User</th><th>Key</th><th>Role</th><th>Classes</th><th>Limits</th><th>Expires</th><th>State</th><th>Usage</th><th></th></tr></thead>
  <tbody id="keys"></tbody>
</table>

<dialog id="key-dialog">
  <form id="key-form">
    <h2 id="key-title"></h2>
    <label>User <input id="f-user" required></label>
    <label>Description <input id="f-description"></label>
    <label>Role <select id="f-role"><option>user</option><option>admin</option><option>metrics</option></select></label>
    <label>Default class <select id="f-default-class"></select></label>
    <label>Other allowed classes (comma separated) <input id="f-allowed-classes"></label>
    <label>Expires (empty: never) <input id="f-expires" type="datetime-local"></label>
    <label>Parallel requests <input id="f-max_parallel_requests" type="number" min="1"></label>
    <label>Requests per minute <input id="f-rpm_limit" type="number" min="1"></label>
    <label>Tokens per minute <input id="f-tpm_limit" type="number" min="1"></label>
    <label>Tokens per day <input id="f-tpd_limit" type="number" min="1"></label>
    <label>Allowed paths, one per line (empty: all) <textarea id="f-routes"></textarea></label>
    <p class="error" id="key-error"></p>
    <button type="button" id="key-cancel">Cancel</button>
    <button>Save</button>
  </form>
</dialog>

<dialog id="secret-dialog">
  <p>Copy the new key now; it can't be shown again.</p>
  <p><code id="secret"></code></p>
  <button id="secret-done">Done</button>
</dialog>

<script>
"use strict";
const API = location.pathname.replace(/\/+$/, "") + "/api/";
const LIMITS = ["max_parallel_requests", "rpm_limit", "tpm_limit", "tpd_limit"];
const $ = (id) => document.getElementById(id);
let apiKey = null, classes = [], editing = null;

async function api(method, path, body) {
  const response = await fetch(API + path, {
    method, cache: "no-store", headers: { authorization: "Bearer " + apiKey },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => null);
  if (response.status === 401) signOut(data?.error?.message);
  if (!response.ok) throw new Error(data?.error?.message || response.statusText);
  return data;
}

function cell(...lines) {
  const td = document.createElement("td");
  for (const line of lines.filter((line) => line !== null)) {
    const div = td.appendChild(document.createElement("div"));
    div.textContent = line;
    if (td.children.length > 1) div.className = "sub";
  }
  return td;
}

function button(text, action) {
  const element = document.createElement("button");
  element.textContent = text;
  element.onclick = () => action().then(refresh).catch((error) => alert(error.message));
  return element;
}

async function refresh() {
  const data = await api("GET", "keys");
  classes = data.classes;
  $("keys").replaceChildren(...data.keys.map((key) => {
    const row = document.createElement("tr");
    const limits = LIMITS.filter((name) => key.limits[name]).map((name) => name + " " + key.limits[name]);
    const usage = key.usage;
    const lastUsed = usage.last_used ? new Date(usage.last_used * 1000).toLocaleString() : "never";
    const state = cell(key.state);
    state.className = key.state;
    const actions = document.createElement("td");
    actions.append(
      button("Edit", async () => openDialog(key)),
      button(key.blocked ? "Unblock" : "Block", () => api("PATCH", "keys/" + key.id, { blocked: !key.blocked })),
      button("Rotate", async () => {
        if (confirm("Replace the key of " + key.user + "? The current key stops working.")) {
          showSecret((await api("POST", "keys/" + key.id + "/rotate")).api_key);
        }
      }),
      button("Delete", async () => {
        if (confirm("Delete the key of " + key.user + "?")) await api("DELETE", "keys/" + key.id);
      }));
    row.append(
      cell(key.user, key.description || null),
      cell(key.id, key.key_prefix + "…"),
      cell(key.role),
      cell(key.default_class, key.allowed_classes.length ? "also " + key.allowed_classes.join(", ") : null),
      cell(limits.join(", ") || "none", key.allowed_routes ? key.allowed_routes.join(", ") : null),
      cell(key.expires_at ? new Date(key.expires_at).toLocaleString() : "never"),
      state,
      cell(usage.in_flight + " in flight, " + usage.requests_last_minute + " requests and " + usage.tokens_last_minute + " tokens in the last minute",
        usage.tokens_last_day + " tokens today, " + usage.requests + " requests in total, last " + lastUsed),
      actions);
    return row;
  }));
}

function openDialog(key) {
  editing = key;
  $("key-title").textContent = key ? "Edit " + key.id : "New key";
  $("f-default-class").replaceChildren(...classes.map((name) => new Option(name, name)));
  $("f-user").value = key?.user ?? "";
  $("f-description").value = key?.description ?? "";
  $("f-role").value = key?.role ?? "user";
  $("f-default-class").value = key?.default_class ?? classes[0];
  $("f-allowed-classes").value = key?.allowed_classes.join(", ") ?? "";
  const expires = key?.expires_at ? new Date(key.expires_at) : null;
  $("f-expires").value = expires ? new Date(expires - expires.getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
  for (const name of LIMITS) $("f-" + name).value = key?.limits[name] ?? "";
  $("f-routes").value = key?.allowed_routes?.join("\n") ?? "";
  $("key-error").textContent = "";
  $("key-dialog").showModal();
}

$("key-form").onsubmit = async (event) => {
  event.preventDefault();
  const list = (text, separator) => text.split(separator).map((item) => item.trim()).filter(Boolean);
  const routes = list($("f-routes").value, "\n");
  const settings = {
    user: $("f-user").value.trim(),
    description: $("f-description").value.trim(),
    role: $("f-role").value,
    default_class: $("f-default-class").value,
    allowed_classes: list($("f-allowed-classes").value, ","),
    expires_at: $("f-expires").value ? new Date($("f-expires").value).toISOString() : null,
    limits: Object.fromEntries(LIMITS.map((name) => [name, Number($("f-" + name).value) || null])),
    allowed_routes: routes.length ? routes : null,
  };
  try {
    if (editing) {
      await api("PATCH", "keys/" + editing.id, settings);
    } else {
      showSecret((await api("POST", "keys", settings)).api_key);
    }
    $("key-dialog").close();
    refresh();
  } catch (error) {
    $("key-error").textContent = error.message;
  }
};

function showSecret(secret) {
  $("secret").textContent = secret;
  $("secret-dialog").showModal();
}

function signOut(message) {
  apiKey = null;
  sessionStorage.removeItem("llm-proxy-admin-key");
  for (const id of ["table", "new-key", "sign-out"]) $(id).hidden = true;
  $("who").textContent = "";
  $("login").hidden = false;
  $("login-error").textContent = message || "";
}

async function signIn(key) {
  apiKey = key;
  try {
    const session = await api("GET", "session");
    sessionStorage.setItem("llm-proxy-admin-key", key);
    $("who").textContent = session.user + " (" + session.key_id + ")";
    $("login").hidden = true;
    for (const id of ["table", "new-key", "sign-out"]) $(id).hidden = false;
    await refresh();
  } catch (error) {
    signOut(error.message);
  }
}

$("login").onsubmit = (event) => { event.preventDefault(); signIn($("login-key").value.trim()); };
$("sign-out").onclick = () => signOut("");
$("new-key").onclick = () => openDialog(null);
$("key-cancel").onclick = () => $("key-dialog").close();
$("secret-done").onclick = () => $("secret-dialog").close();
setInterval(() => apiKey && refresh().catch(() => {}), 5000);
const stored = sessionStorage.getItem("llm-proxy-admin-key");
if (stored) signIn(stored); else signOut("");
</script>
</body>
</html>
