[package]
name = "llm-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = { version = "0.1", features = ["channel"] }
bytes = "1"
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"], optional = true }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
http = "1"
nix = { version = "0.31", features = ["fs", "mman", "process", "signal", "time"] }
httparse = "1"
base64 = "0.22"
jiff = { version = "0.2", default-features = false, features = ["std"] }

[features]
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rcgen"]

[profile.release]
lto = true

[dev-dependencies]
nix = { version = "0.31", features = ["signal"] }
tempfile = "3.27.0"
