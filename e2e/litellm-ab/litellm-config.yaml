# A/B replica: paritytech/lite-llm-proxy's config.yaml VERBATIM, plus one
# `vllm-pod-sN` credential per test slot (each slot has its own llm-proxy A
# behind its own tunnel port). Nothing else differs.
# Copyright (C) Parity Technologies (UK) Ltd.
# SPDX-License-Identifier: Apache-2.0
#
#
# Named credentials, selectable in the admin UI when adding a model. This is how
# the model menu lives in the database while the secrets do not: a model row
# references a credential by name, and the actual values resolve from the
# container environment (.env, rendered by Ansible from the vault) at call time.
# Adding a credential here needs a 03-stack.yml run; picking one is a UI action.
credential_list:
  - credential_name: openrouter
    credential_values:
      api_key: os.environ/OPENROUTER_API_KEY
    credential_info:
      description: "OpenRouter — all openrouter/* models and curated aliases"

  - credential_name: moonshot
    credential_values:
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE
    credential_info:
      description: "Kimi / Moonshot — the kimi-* aliases"

  # api_base belongs on the credential rather than each model row: both pod
  # aliases reach the GPU pod through the same reverse SSH tunnel, so the
  # address has one home. host.docker.internal is the docker0 gateway, where
  # sshd binds the tunnel (see docker-compose.yml extra_hosts).
  - credential_name: vllm-pod
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18000/v1
    credential_info:
      description: "Self-hosted vLLM GPU pod — auto/ and parity/ aliases"

  # ---- A/B replica slots ----
  - credential_name: vllm-pod-s0
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18000/v1
    credential_info:
      description: "A/B replica slot 0: the reverse tunnel to llm-proxy A of slot 0"

  - credential_name: vllm-pod-s1
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18001/v1
    credential_info:
      description: "A/B replica slot 1: the reverse tunnel to llm-proxy A of slot 1"

  - credential_name: vllm-pod-s2
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18002/v1
    credential_info:
      description: "A/B replica slot 2: the reverse tunnel to llm-proxy A of slot 2"

  - credential_name: vllm-pod-s3
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18003/v1
    credential_info:
      description: "A/B replica slot 3: the reverse tunnel to llm-proxy A of slot 3"

  - credential_name: vllm-pod-s4
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18004/v1
    credential_info:
      description: "A/B replica slot 4: the reverse tunnel to llm-proxy A of slot 4"

  - credential_name: vllm-pod-s5
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18005/v1
    credential_info:
      description: "A/B replica slot 5: the reverse tunnel to llm-proxy A of slot 5"

  - credential_name: vllm-pod-s6
    credential_values:
      api_key: os.environ/VLLM_API_KEY
      api_base: http://host.docker.internal:18006/v1
    credential_info:
      description: "A/B replica slot 6: the reverse tunnel to llm-proxy A of slot 6"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_retention_interval: "1d"

  # Pass the caller's own headers through to the upstream provider.
  forward_client_headers_to_llm_api: true

litellm_settings:
  drop_params: true

  # Stamp requests to the provider with the calling key's user/team info.
  add_user_information_to_llm_headers: true

  # No fallbacks
  # fallbacks:
  #  - auto/deepseek-v4.1-flash: ["openrouter/deepseek/deepseek-v4.1-flash"]
