# Generated for the llm-proxy A/B replica; see compose.yml. The `location /`
# blocks are production's site.conf.j2 verbatim (minus TLS).
worker_processes auto;
events { worker_connections 8192; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # slot 0: A = nginx -> LiteLLM, B = nginx -> llm-proxy B on the host
    server {
        listen 21010;
        client_max_body_size 100m;
        location / {
            proxy_pass http://litellm:4000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
    server {
