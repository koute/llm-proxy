# Local replica of paritytech/lite-llm-proxy's docker-compose.yml for A/B tests.
#
# Differences from production, all deliberate:
#   * Images are pinned by digest (same tags as production).
#   * LiteLLM and Postgres sit on an `internal: true` network: no egress to the
#     internet at all. nginx is the only container with a second network.
#   * nginx replaces both the host's nginx (same site config, without TLS) and
#     the reverse SSH tunnel: on the internal network it answers as
#     host.docker.internal and forwards port 18000+N to llm-proxy A of slot N on
#     the host, like `ssh -R` does in production.
#   * LITELLM_LOCAL_MODEL_COST_MAP=True, since there is no internet; the pod's
#     model rows have explicit zero costs, as in production.
name: llm-proxy-ab
services:
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.103.6@sha256:76ad306ce3927ce5224f6fac0139e08badbfa2b32a178032296c1e867abd4cbe
    restart: unless-stopped
    env_file: [.env]
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  nginx:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # written by `python3 ab.py nginx`
    extra_hosts:
      # Docker Desktop's host address, IPv4 only: host-gateway also yields an
      # unreachable IPv6 address, which nginx would use as a second upstream peer.
      - "macos-host:192.168.65.254"
    depends_on: [litellm]
    ports:
      # Slot N: 21N10 = path A (nginx -> LiteLLM), 21N20 = path B (nginx -> llm-proxy B).
      - "127.0.0.1:21010:21010"
      - "127.0.0.1:21020:21020"
      - "127.0.0.1:21110:21110"
      - "127.0.0.1:21120:21120"
      - "127.0.0.1:21210:21210"
      - "127.0.0.1:21220:21220"
      - "127.0.0.1:21310:21310"
      - "127.0.0.1:21320:21320"
      - "127.0.0.1:21410:21410"
      - "127.0.0.1:21420:21420"
      - "127.0.0.1:21510:21510"
      - "127.0.0.1:21520:21520"
      - "127.0.0.1:21610:21610"
      - "127.0.0.1:21620:21620"
      # LiteLLM directly (admin API, UI) without nginx.
      - "127.0.0.1:21000:4000"
    networks:
      internal:
        aliases: [host.docker.internal]
      edge: {}

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge
